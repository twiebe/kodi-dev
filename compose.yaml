# Isolated test environment: Kodi (default 21.3) + Jellyfin, both only on 127.0.0.1.
# Configure the add-on under test in .env (see .env.example), drive it with ./kdev.
name: kodi-dev

services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-12.3}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ./data/media:/media:ro
    ports:
      - "127.0.0.1:${JELLYFIN_PORT:-8096}:8096"
    restart: unless-stopped

  kodi:
    build:
      context: ./kodi
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        DEBIAN_SUITE: ${KODI_DEBIAN_SUITE:-forky}
        KODI_VERSION: ${KODI_VERSION:-2:21.3*}
    image: kodi-dev/kodi:${KODI_DEBIAN_SUITE:-forky}
    environment:
      KODI_RESOLUTION: ${KODI_RESOLUTION:-1280x720}
    volumes:
      - ./data/kodi:/home/kodi/.kodi
      - ${ADDON_DIR:?set ADDON_DIR in .env}:/home/kodi/.kodi/addons/${ADDON_ID:?set ADDON_ID in .env}
    ports:
      - "127.0.0.1:${KODI_RPC_PORT:-8080}:8080"
      - "127.0.0.1:${KODI_VNC_PORT:-5900}:5900"
    depends_on:
      - jellyfin
    restart: unless-stopped
