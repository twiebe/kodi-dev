# Isolated test environment: Kodi (default 21.3) + Jellyfin, both only on 127.0.0.1.
# Configure the add-on under test in .env (see .env.example), drive it with ./kdev.
name: kodi-dev

services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-12.3}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ${KDEV_DATA:-./data}/jellyfin/config:/config
      - ${KDEV_DATA:-./data}/jellyfin/cache:/cache
      - ${KDEV_DATA:-./data}/media:/media:ro
    ports:
      - "127.0.0.1:${JELLYFIN_PORT:-8096}:8096"
    # The image checks every 30 s; Kodi waits for the first healthy check
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "localhost", "-fsS", "http://localhost:8096/health"]
      interval: 2s
      timeout: 5s
      retries: 90
    restart: unless-stopped

  # Passes requests through to Jellyfin, fails selected ones: ./kdev fault
  faultproxy:
    image: python:3.13-alpine
    user: "${UID:-1000}:${GID:-1000}"
    command: ["python3", "-u", "/app/faultproxy.py"]
    volumes:
      - ./faultproxy:/app:ro
      - ${KDEV_DATA:-./data}/faults:/data
    ports:
      - "127.0.0.1:${FAULTPROXY_PORT:-8097}:8096"
    depends_on:
      - jellyfin
    restart: unless-stopped

  kodi:
    build:
      context: ./kodi
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        DEBIAN_SUITE: ${KODI_DEBIAN_SUITE:-forky}
        KODI_VERSION: ${KODI_VERSION:-2:21.3*}
    image: kodi-dev/kodi:${KODI_DEBIAN_SUITE:-forky}
    environment:
      KODI_RESOLUTION: ${KODI_RESOLUTION:-1280x720}
    volumes:
      - ${KDEV_DATA:-./data}/kodi:/home/kodi/.kodi
      - ${ADDON_DIR:?set ADDON_DIR in .env}:/home/kodi/.kodi/addons/${ADDON_ID:?set ADDON_ID in .env}
    ports:
      - "127.0.0.1:${KODI_RPC_PORT:-8080}:8080"
      - "127.0.0.1:${KODI_VNC_PORT:-5900}:5900"
    # Add-ons log in at Kodi start; with Jellyfin not up yet they stay logged out
    depends_on:
      jellyfin:
        condition: service_healthy
    restart: unless-stopped
